# 部署编排（首次启动后会生成 data/config.json，所有站点与第三方配置请在 /admin 设置页完成）
# 起停：cd deploy && docker compose up -d / down
# 安全提醒：公网部署务必通过 HTTPS 反向代理暴露，切勿直接公网 HTTP 暴露（否则 /admin 密码与设备 Bearer Token 明文传输）
name: hongtang-live
services:
  hongtang-live:
    image: hongtang-live:1
    container_name: hongtang-live
    restart: unless-stopped
    ports:
      - "8090:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 可选：首次启动（data/config.json 不存在）时从仓库根目录 .env 读取初始环境变量
    env_file:
      - path: ../.env
        required: false
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/data
      - WEB_DIR=/app/web
      - DAYLOG_DB=/daylog/data/app.db
      - DAYLOG_ROOT=/daylog
      - HOST_PROC=/host/proc
      - HOST_ROOT=/host/root
      - ROOT_DISK=/data
    volumes:
      - ../data:/data
      - ../daylog:/daylog
      - /proc:/host/proc:ro
      - /etc/hostname:/host/root/etc/hostname:ro
      - /etc/os-release:/host/root/etc/os-release:ro
      # 如需监控宿主机额外挂载卷，按需取消注释：
      # - /mnt/vol1:/host/vol1:ro
