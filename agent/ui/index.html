<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红糖似了吗？· 采集程序</title>
<style>
:root { --bg:#0c1533; --win:#14204a; --win2:#1b2a5c; --line:#f4f4f0; --gold:#ffd23f; --dim:#b9c2e0; --mute:#7c86b0; --track:#2a3870; --red:#ff7a6b; --green:#8ce99a; }
* { box-sizing: border-box; border-radius: 0; }
html, body { margin: 0; background: var(--bg); color: var(--line); }
body { font: 14px/1.7 "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; padding-bottom: 40px; }
header { padding: 12px 20px; border-bottom: 3px solid var(--line); display: flex; gap: 12px; align-items: center; }
header b::before { content: "▶ "; color: var(--gold); }
header .sp { flex: 1; }
main { max-width: 760px; margin: 0 auto; padding: 18px 16px; }
.win { background: var(--win); border: 3px solid var(--line); padding: 16px 18px; margin: 0 0 18px; }
.win h2 { margin: 0 0 8px; font-size: 14px; font-weight: 400; color: var(--gold); }
.win h2::before { content: "■ "; }
.hint, .muted { color: var(--mute); font-size: 12px; }
.ok { color: var(--green); } .bad { color: var(--red); } .gold { color: var(--gold); }
label { display: block; color: var(--dim); font-size: 12px; margin: 8px 0 3px; }
input[type=text], input[type=number] { width: 100%; font: inherit; color: var(--line); background: var(--bg); border: 2px solid var(--line); padding: 6px 8px; outline: 0; }
input:focus { border-color: var(--gold); }
.chk { display: inline-flex; gap: 6px; align-items: center; margin: 4px 14px 4px 0; color: var(--dim); cursor: pointer; }
.chk input { accent-color: var(--gold); }
button { font: inherit; color: var(--line); background: var(--win); border: 3px solid var(--line); padding: 4px 14px; cursor: pointer; margin: 4px 6px 4px 0; }
button:hover { border-color: var(--gold); color: var(--gold); }
button.primary { background: var(--gold); color: var(--bg); border-color: var(--gold); }
button.danger:hover { border-color: var(--red); color: var(--red); }
.kv { display: grid; grid-template-columns: 8em 1fr; gap: 2px 12px; }
.kv > :nth-child(odd) { color: var(--mute); }
.kv > * { min-width: 0; overflow-wrap: anywhere; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
pre { background: var(--bg); border: 2px solid var(--track); padding: 8px; max-height: 260px; overflow: auto; font-size: 12px; white-space: pre-wrap; margin: 6px 0 0; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--win); border: 3px solid var(--line); padding: 6px 14px; display: none; }
#toast.show { display: block; } #toast.err { border-color: var(--red); color: var(--red); }
@media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><b id="head">采集程序</b><span class="sp"></span><span class="muted" id="ver"></span></header>
<main id="app"><p class="muted">加载中…</p></main>
<div id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
